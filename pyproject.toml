[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "litellm-cost-waybar"
version = "0.2.1"
description = "LiteLLM spend indicator for Waybar"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
dependencies = ["click>=8.1"]

[project.scripts]
litellm-cost = "litellm_cost_waybar.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["litellm_cost_waybar*"]
